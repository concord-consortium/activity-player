name: Continuous Integration

on: push

jobs:
  build_test:
    name: Build and Run Jest Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Install Dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Run Tests
        run: npm run test:coverage -- --runInBand
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          flags: jest
          token: ${{ secrets.CODECOV_TOKEN }}
  cypress:
    runs-on: ubuntu-latest
    container: cypress/browsers:node-22.21.0-chrome-141.0.7390.107-1-ff-144.0-edge-141.0.3537.92-1
    strategy:
      # when one test fails, DO NOT cancel the other
      # containers, because this will kill Cypress processes
      # leaving the Dashboard hanging ...
      # https://github.com/cypress-io/github-action/issues/48
      fail-fast: false
      matrix:
        # run 6 copies of the current job in parallel (Cypress Cloud's recommended
        # runner count to minimize total e2e wall-clock time)
        containers: [1, 2, 3, 4, 5, 6]
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
      - uses: cypress-io/github-action@v7
        with:
          start: npm start
          wait-on: 'http://localhost:8080'
          # only record the results to dashboard.cypress.io if CYPRESS_RECORD_KEY is set
          record: ${{ !!secrets.CYPRESS_RECORD_KEY }}
          # only do parallel if we have a record key
          parallel: ${{ !!secrets.CYPRESS_RECORD_KEY }}
        env:
          # pass the Dashboard record key as an environment variable
          CYPRESS_RECORD_KEY: ${{ secrets.CYPRESS_RECORD_KEY }}
          # pass GitHub token to allow accurately detecting a build vs a re-run build
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # turn on code coverage when running npm start
          # so far we've been using a webpack istanbul-instrumenter-loader for this
          # but there has been work on building code coverage into node itself, which
          # should be much faster
          CODE_COVERAGE: true
      # codecov-action v5 needs curl and gpg, which the Cypress container doesn't have.
      - name: Install Codecov uploader dependencies
        run: apt-get update && apt-get install -y curl gpg
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          flags: cypress
          token: ${{ secrets.CODECOV_TOKEN }}
  playwright:
    name: Run Playwright Tests
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Install Dependencies
        run: npm ci
        env:
          # Playwright tests don't need the Cypress binary
          CYPRESS_INSTALL_BINARY: 0
      # Playwright runs tests without checking their types, and the root tsconfig covers only src.
      - name: Type-check Playwright tests
        run: npm run check:playwright
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium
      - name: Run Playwright tests
        run: npx playwright test
        env:
          CI: "true"
      - name: Upload coverage to Codecov
        if: always()
        uses: codecov/codecov-action@v5
        with:
          flags: playwright
          token: ${{ secrets.CODECOV_TOKEN }}
          files: test-results/coverage/coverage.lcov
      - uses: concord-consortium/s3-deploy-action/deploy-path@v1
        if: always()
        id: s3-deploy-path
      - uses: aws-actions/configure-aws-credentials@v6
        if: always()
        with:
          role-to-assume: arn:aws:iam::612297603577:role/activity-player
          aws-region: us-east-1
      - name: Upload Playwright Report
        # Without a deploy path, the --delete would empty every other branch's report.
        if: always() && steps.s3-deploy-path.outputs.deployPath
        # The deploy path comes from the branch or tag name, which can contain shell syntax, so it
        # is passed in the environment and quoted rather than written into the command.
        run: aws s3 sync ./playwright-report "s3://models-resources/activity-player/playwright-report/$DEPLOY_PATH" --delete --cache-control "no-cache, max-age=0"
        env:
          DEPLOY_PATH: ${{ steps.s3-deploy-path.outputs.deployPath }}
      # This workflow runs on push, not pull_request, so the report action can't find the PR
      # itself. With no open PR for the branch the number is empty and the action skips the comment.
      - name: Find the pull request for this branch
        if: always()
        id: find-pr
        run: echo "number=$(gh pr list --head "$GITHUB_REF_NAME" --state open --json number --jq '.[0].number')" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
      - uses: daun/playwright-report-summary@v4
        if: always()
        with:
          report-file: test-results/results.json
          report-url: https://models-resources.concord.org/activity-player/playwright-report/${{ steps.s3-deploy-path.outputs.deployPath }}/
          pr-number: ${{ steps.find-pr.outputs.number }}
  # The deploy waits for Jest and Cypress but not for Playwright, so a failing Playwright test
  # doesn't hold back the branch build.
  s3-deploy:
    name: S3 Deploy
    needs:
      - build_test
      - cypress
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Install Dependencies
        run: npm ci
        env:
          # skip installing cypress since it isn't needed for just building
          # This decreases the deploy time quite a bit
          CYPRESS_INSTALL_BINARY: 0
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::612297603577:role/activity-player
          aws-region: us-east-1
      - uses: concord-consortium/s3-deploy-action@v1
        with:
          bucket: models-resources
          prefix: activity-player
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          deployRunUrl: https://activity-player.concord.org/__deployPath__/index.html
          # Parameters to GHActions have to be strings, so a regular yaml array cannot
          # be used. Instead the `|` turns the following lines into a string
          topBranches: |
            ["master"]

